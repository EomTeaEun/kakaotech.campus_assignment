<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- 배경 이미지 + 슬롯 오버레이를 함께 담는 기준 컨테이너 -->
    <div class="inventory-wrapper">

      <!-- 마인크래프트 인벤토리 배경 이미지 (고정 크기) -->
      <img src="assets/background.jpeg" alt="Minecraft Inventory" class="inventory-bg">

      <!-- Todo 추가 버튼 — 배경 이미지 위에 절대 위치로 배치 -->
      <div class="add-todo-wrapper" id="addTodoBtn">
        <img src="assets/button.png" alt="Add Todo" class="add-todo-btn">
        <span class="add-todo-label">TODO 추가하기</span>
      </div>

      <!-- 인벤토리 슬롯 27개 (3행 × 9열) — 배경 이미지 위에 position: absolute로 배치 -->
      <div class="inventory-grid" id="inventoryGrid">
        <div class="inventory-slot" data-slot-index="0"></div>
        <div class="inventory-slot" data-slot-index="1"></div>
        <div class="inventory-slot" data-slot-index="2"></div>
        <div class="inventory-slot" data-slot-index="3"></div>
        <div class="inventory-slot" data-slot-index="4"></div>
        <div class="inventory-slot" data-slot-index="5"></div>
        <div class="inventory-slot" data-slot-index="6"></div>
        <div class="inventory-slot" data-slot-index="7"></div>
        <div class="inventory-slot" data-slot-index="8"></div>
        <div class="inventory-slot" data-slot-index="9"></div>
        <div class="inventory-slot" data-slot-index="10"></div>
        <div class="inventory-slot" data-slot-index="11"></div>
        <div class="inventory-slot" data-slot-index="12"></div>
        <div class="inventory-slot" data-slot-index="13"></div>
        <div class="inventory-slot" data-slot-index="14"></div>
        <div class="inventory-slot" data-slot-index="15"></div>
        <div class="inventory-slot" data-slot-index="16"></div>
        <div class="inventory-slot" data-slot-index="17"></div>
        <div class="inventory-slot" data-slot-index="18"></div>
        <div class="inventory-slot" data-slot-index="19"></div>
        <div class="inventory-slot" data-slot-index="20"></div>
        <div class="inventory-slot" data-slot-index="21"></div>
        <div class="inventory-slot" data-slot-index="22"></div>
        <div class="inventory-slot" data-slot-index="23"></div>
        <div class="inventory-slot" data-slot-index="24"></div>
        <div class="inventory-slot" data-slot-index="25"></div>
        <div class="inventory-slot" data-slot-index="26"></div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
