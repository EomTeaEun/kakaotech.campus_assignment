<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">

    <!-- 배경 이미지 + 슬롯 오버레이를 함께 담는 기준 컨테이너 -->
    <div class="inventory-wrapper">

      <img src="assets/background.jpeg" alt="Minecraft Inventory" class="inventory-bg">

      <!-- 날짜 네비게이션 -->
      <div class="date-nav" id="dateNav">
        <div class="date-nav-btn" id="datePrev">
          <img src="assets/button.png" alt="" class="date-nav-btn-bg">
          <span class="date-nav-btn-label">◀</span>
        </div>
        <span class="date-text" id="dateText"></span>
        <div class="date-nav-btn" id="dateNext">
          <img src="assets/button.png" alt="" class="date-nav-btn-bg">
          <span class="date-nav-btn-label">▶</span>
        </div>
      </div>

      <!-- Todo 추가 버튼 -->
      <div class="add-todo-wrapper" id="addTodoBtn">
        <img src="assets/button.png" alt="" class="add-todo-btn">
        <span class="add-todo-label">TODO 추가하기</span>
      </div>

      <!-- 상태별 필터 탭 (좌측 세로 배치: 전체 / 진행중 / 완료) -->
      <div class="filter-tabs" id="filterTabs">
        <div class="filter-tab active" data-filter="all">
          <img src="assets/button.png" alt="" class="filter-tab-bg">
          <span class="filter-tab-label">전체</span>
        </div>
        <div class="filter-tab" data-filter="active">
          <img src="assets/button.png" alt="" class="filter-tab-bg">
          <span class="filter-tab-label">진행중</span>
        </div>
        <div class="filter-tab" data-filter="done">
          <img src="assets/button.png" alt="" class="filter-tab-bg">
          <span class="filter-tab-label">완료</span>
        </div>
      </div>

      <!-- 인벤토리 슬롯 27개 (3행 × 9열) -->
      <div class="inventory-grid" id="inventoryGrid">
        <div class="inventory-slot" data-slot-index="0"></div>
        <div class="inventory-slot" data-slot-index="1"></div>
        <div class="inventory-slot" data-slot-index="2"></div>
        <div class="inventory-slot" data-slot-index="3"></div>
        <div class="inventory-slot" data-slot-index="4"></div>
        <div class="inventory-slot" data-slot-index="5"></div>
        <div class="inventory-slot" data-slot-index="6"></div>
        <div class="inventory-slot" data-slot-index="7"></div>
        <div class="inventory-slot" data-slot-index="8"></div>
        <div class="inventory-slot" data-slot-index="9"></div>
        <div class="inventory-slot" data-slot-index="10"></div>
        <div class="inventory-slot" data-slot-index="11"></div>
        <div class="inventory-slot" data-slot-index="12"></div>
        <div class="inventory-slot" data-slot-index="13"></div>
        <div class="inventory-slot" data-slot-index="14"></div>
        <div class="inventory-slot" data-slot-index="15"></div>
        <div class="inventory-slot" data-slot-index="16"></div>
        <div class="inventory-slot" data-slot-index="17"></div>
        <div class="inventory-slot" data-slot-index="18"></div>
        <div class="inventory-slot" data-slot-index="19"></div>
        <div class="inventory-slot" data-slot-index="20"></div>
        <div class="inventory-slot" data-slot-index="21"></div>
        <div class="inventory-slot" data-slot-index="22"></div>
        <div class="inventory-slot" data-slot-index="23"></div>
        <div class="inventory-slot" data-slot-index="24"></div>
        <div class="inventory-slot" data-slot-index="25"></div>
        <div class="inventory-slot" data-slot-index="26"></div>
      </div>

    </div>
  </div>

  <!-- 슬롯 호버 툴팁 (마우스 오버 시 Todo 세부 정보 표시) -->
  <div class="slot-tooltip" id="slotTooltip"></div>

  <!-- Todo 입력/수정 모달 -->
  <div class="todo-modal-overlay" id="todoModal">
    <div class="todo-modal-container">

      <!-- todo_write.png 책 배경 + 내부 입력 필드들 -->
      <div class="todo-write-wrapper">
        <img src="assets/todo_write.png" alt="" class="todo-write-bg">

        <!-- 제목 -->
        <span class="todo-field-label" id="labelTitle">제목</span>
        <input type="text" class="todo-field-input" id="todoTitle" placeholder="할 일 제목">

        <!-- 세부 내용 -->
        <span class="todo-field-label" id="labelDetail">내용</span>
        <textarea class="todo-field-textarea" id="todoDetail" placeholder="세부 내용 (선택)"></textarea>

        <!-- 마감 기한 -->
        <span class="todo-field-label" id="labelDeadline">마감 기한</span>
        <input type="date" class="todo-field-input" id="todoDeadline">

        <!-- 우선순위 슬라이더 -->
        <span class="todo-field-label" id="labelPriority">
          우선순위&nbsp;<span id="priorityValue">50</span>
        </span>
        <input type="range" class="todo-field-range" id="todoPriority" min="1" max="64" value="32">

        <!-- 하단 액션 버튼 (책 안쪽에 절대 위치) -->
        <div class="todo-modal-buttons">
          <div class="modal-btn-wrapper" id="btnConfirm">
            <img src="assets/button.png" alt="" class="modal-btn-bg">
            <span class="modal-btn-label">확인</span>
          </div>
          <div class="modal-btn-wrapper" id="btnEdit">
            <img src="assets/button.png" alt="" class="modal-btn-bg">
            <span class="modal-btn-label">수정</span>
          </div>
          <div class="modal-btn-wrapper" id="btnDelete">
            <img src="assets/button.png" alt="" class="modal-btn-bg">
            <span class="modal-btn-label">삭제</span>
          </div>
          <div class="modal-btn-wrapper" id="btnComplete">
            <img src="assets/button.png" alt="" class="modal-btn-bg">
            <span class="modal-btn-label">완료</span>
          </div>
          <div class="modal-btn-wrapper" id="btnClose">
            <img src="assets/button.png" alt="" class="modal-btn-bg">
            <span class="modal-btn-label">닫기</span>
          </div>
        </div>

      </div><!-- /todo-write-wrapper -->
    </div><!-- /todo-modal-container -->
  </div><!-- /todo-modal-overlay -->

  <script src="app.js"></script>
</body>
</html>
